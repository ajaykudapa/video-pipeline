global:
  scrape_interval: 10s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Workers are discovered dynamically via the Docker socket so that
  # autoscaler-created containers are scraped too.
  - job_name: workers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_videopipeline_role]
        regex: worker
        action: keep
      - source_labels: [__meta_docker_network_ip]
        regex: (.+)
        target_label: __address__
        replacement: ${1}:9100
      - source_labels: [__meta_docker_container_name]
        regex: /?(.*)
        target_label: instance
        replacement: ${1}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
